[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypersae"
version = "0.1.0"
description = "High-Performance Hyperbolic Sparse Autoencoders for Mechanistic Interpretability"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Vishal Verma", email = "vishal.verma@dehurdle.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "geoopt>=0.5.0",
    "einops>=0.6.0",
    "networkx>=3.0",
    "plotly>=5.0.0",
    "geomstats>=2.5.0",
    "transformer-lens>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hypersae"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

